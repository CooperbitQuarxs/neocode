name: Issue Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync issue labels
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure managed issue labels exist
        uses: actions/github-script@v7
        with:
          script: |
            // Iteration 1 vocabulary; existing colors are preserved.
            const managedLabels = [
              { name: "bug", color: "d73a4a", description: "Something isn't working" },
              { name: "enhancement", color: "a2eeef", description: "New feature or request" },
              { name: "documentation", color: "0075ca", description: "User- or agent-facing docs, README or changelog" },
              { name: "accessibility", color: "f143ab", description: "Barrier affecting people with disabilities" },
              { name: "idea", color: "c5def5", description: "An undecided possibility; not a spec, not authorized work" },
              { name: "experiment", color: "d4c5f9", description: "Tried on an experimental/ branch; never merged to nightly or default without an owner decision" },
              { name: "spec", color: "7057ff", description: "Is or contains an implementation specification" },
              { name: "hotfix", color: "d93f0b", description: "Urgent targeted fix to the default branch" },
              { name: "upstream", color: "5319e7", description: "Upstream is involved: sync, compatibility, conflict avoidance or divergence" },
              { name: "downstream", color: "f5c2e7", description: "Needed by a project that consumes this one" },
              { name: "duplicate", color: "cfd3d7", description: "Same request as another issue; context merged into the canonical one" },
              { name: "entangled", color: "cba6f7", description: "Incompatible alternatives; the owner chooses one, the rest close" },
              { name: "baseline", color: "c5def5", description: "Pre-existing defect found on the base during review (kept this iteration)" },
              { name: "invalid", color: "e4e669", description: "Closed: wrong repo, missing required information or format, or policy violation" },
              { name: "wontfix", color: "ffffff", description: "Closed: will not be worked on" },
              { name: "stale: identical", color: "bfd4f2", description: "Already implemented essentially as specified" },
              { name: "stale: similar", color: "d4c5f9", description: "Implemented differently; open for the remaining differences" },
              { name: "priority: p0", color: "f38ba8", description: "Blocks current work or handles an active incident" },
              { name: "priority: p1", color: "fab387", description: "High value or prerequisite for several issues" },
              { name: "priority: p2", color: "f9e2af", description: "Useful planned work" },
              { name: "priority: p3", color: "89b4fa", description: "Backlog or opportunistic work" },
              { name: "difficulty: 0.000-0.125", color: "a6e3a1", description: "Estimated implementation difficulty in 0.000-0.125." },
              { name: "difficulty: 0.125-0.250", color: "94e2d5", description: "Estimated implementation difficulty in 0.125-0.250." },
              { name: "difficulty: 0.250-0.375", color: "89dceb", description: "Estimated implementation difficulty in 0.250-0.375." },
              { name: "difficulty: 0.375-0.500", color: "74c7ec", description: "Estimated implementation difficulty in 0.375-0.500." },
              { name: "difficulty: 0.500-0.625", color: "f9e2af", description: "Estimated implementation difficulty in 0.500-0.625." },
              { name: "difficulty: 0.625-0.750", color: "fab387", description: "Estimated implementation difficulty in 0.625-0.750." },
              { name: "difficulty: 0.750-0.875", color: "eba0ac", description: "Estimated implementation difficulty in 0.750-0.875." },
              { name: "difficulty: 0.875-1.000", color: "f38ba8", description: "Estimated implementation difficulty in 0.875-1.000." },
              { name: "frame: hours", color: "b4befe", description: "Estimated time frame: hours (agent estimates lowered one unit)" },
              { name: "frame: days", color: "cba6f7", description: "Estimated time frame: days (agent estimates lowered one unit)" },
              { name: "frame: weeks", color: "f5c2f7", description: "Estimated time frame: weeks (agent estimates lowered one unit)" },
              { name: "frame: months", color: "eba0ac", description: "Estimated time frame: months (agent estimates lowered one unit)" },
              { name: "frame: years", color: "f38ba8", description: "Estimated time frame: years (agent estimates lowered one unit)" },
              { name: "needs-triage", color: "d4c5f9", description: "Not yet triaged" },
              { name: "triage: started", color: "1d76db", description: "Triage in progress; labels are provisional" },
              { name: "needs-info", color: "fbca04", description: "Cannot proceed until the named information arrives" },
              { name: "agent: pending", color: "1d76db", description: "Ready for an out-of-the-loop (OTL) agent to pick up" },
              { name: "agent: started", color: "fbca04", description: "An agent has claimed this; do not duplicate the work" },
              { name: "agent: finished", color: "0e8a16", description: "The agent's part is done; not necessarily mergeable" },
              { name: "human: pending", color: "1d76db", description: "Needs an in-the-loop (ITL) session with a human" },
              { name: "human: started", color: "fbca04", description: "A human has claimed the in-the-loop part" },
              { name: "human: finished", color: "0e8a16", description: "The human's in-the-loop part is done" },
              { name: "review: codex", color: "c5def5", description: "Codex reviews this change (mention @codex)" },
              { name: "review: requested (codex)", color: "1d76db", description: "A Codex round is requested on the current head" },
              { name: "review: open (codex)", color: "d93f0b", description: "Codex findings are unanswered on the current head" },
              { name: "review: closed (codex)", color: "0e8a16", description: "Codex's latest round on the current head is clean and every finding answered" },
              { name: "review: stalled (codex)", color: "b60205", description: "Review loop ended with findings unresolved; summary posted" },
              { name: "mergeable", color: "0e8a16", description: "Meets this repository's documented merge criteria; who merges is policy" },
              { name: "sentinel-review-requested", color: "b60205", description: "Mandatory sentinel panel review requested" },
            ];

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (
                  existing.color !== label.color ||
                  (existing.description ?? "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }
