name: promote-nightly

# Open the monthly promotion PR for the owner to merge.
# Keep the integration snapshot and its review history stable on repeated runs.

on:
  schedule:
    - cron: "0 6 1 * *" # First day of each month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-nightly
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: main
      SOURCE: nightly
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: nightly

      - name: Decide whether there is anything to promote
        id: diff
        run: |
          ahead=$(git rev-list --count "origin/$BASE..origin/$SOURCE")
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "$SOURCE is $ahead commits ahead of $BASE"

      - name: Open the promotion PR
        if: steps.diff.outputs.ahead != '0'
        id: pr
        run: |
          set -euo pipefail
          date=$(date -u +%Y-%m-%d)
          branch="sync/promote-$date"
          labels="human: pending,review: codex"
          existing=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f base="$BASE" -f state=open -F per_page=100 --paginate --slurp |
            jq '[.[][] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) |
              select(.head.ref | startswith("sync/promote-"))][0].number // empty')
          if [ -n "$existing" ]; then
             gh pr edit "$existing" --add-label "$labels"
             echo "number=$existing" >> "$GITHUB_OUTPUT"
             exit 0
          fi
          git push origin "origin/$SOURCE:refs/heads/$branch"
          body=$(mktemp)
          {
             echo "> [!NOTE]"
             echo "> promote-nightly workflow on behalf of PsychedelicShayna"
             echo
             echo "## What"
             echo
             echo "Monthly promotion of \`$SOURCE\` into \`$BASE\` (${{ steps.diff.outputs.ahead }} commits), awaiting the owner's merge decision."
             echo
             echo "## Why"
             echo
             echo "Scheduled promotion per \`docs/policy/README.md\` › Promotion. Everything here already merged into \`$SOURCE\` through its own PR."
             echo
             echo "## Testing"
             echo
             echo "No new code; each change was verified in its originating PR."
             echo
             echo "---"
             echo
             echo "- [ ] \`vp check\` and \`vpr typecheck\` pass (not run: promotion PR)"
             echo "- [ ] Tested locally (not run: promotion PR)"
          } > "$body"
          url=$(gh pr create --base "$BASE" --head "$branch" \
             --title "chore(promote): nightly into main $date" \
             --body-file "$body" --label "$labels")
          number=${url##*/}
          [ -n "$number" ] || { echo "::error::could not determine the promotion PR number"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"

