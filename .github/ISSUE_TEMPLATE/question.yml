name: Question
description: Ask about usage or configuration
labels: ["question", "needs-triage"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do?

  - type: dropdown
    id: area
    attributes:
      label: Topic
      options:
        - Install / updates
        - Provider setup / login
        - Remote access / devices
        - Configuration
        - Other

  - type: dropdown
    id: environment
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
