name: Bug Report
description: Report a bug or crash
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Output
      description: Paste any error messages or stack traces. Redact secrets and home directory paths.
      render: shell

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop app
        - Web (local server)
        - Mobile
        - Server / CLI
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows (native)
        - Windows (WSL)
        - iOS
        - Android
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NeoCode version
      description: App version from About or Settings, or the commit you built.
      placeholder: "e.g. 0.1.0-preview.20260930.1"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which provider were you using? Leave blank if not provider-specific.
      options:
        - NeoPi
        - Codex
        - Claude
        - Cursor
        - Grok
        - OpenCode
        - Antigravity
        - Other

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - apps/web
        - apps/server
        - apps/desktop
        - apps/mobile
        - packages/contracts or packages/shared
        - Build, CI, or release tooling
        - Docs
        - Not sure

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, config snippets, or other relevant information
